apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-deployment
  labels:
      app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
      matchLabels:
        app: {{ .Chart.Name }}
        release: {{ .Release.Name }}
  template:
      metadata:
        labels:
          app: {{ .Chart.Name }}
          release: {{ .Release.Name }}
      spec:
        containers:
          - name: {{ .Chart.Name }}
            image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
            ports:
              - containerPort: {{ .Values.containerPorts.http }}